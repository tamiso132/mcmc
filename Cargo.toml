[package]
name = "rust_render_graph"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0" 
ash-window = "0.13.0"
# --- This is the correct bootstrap library ---
ash-bootstrap = "0.1.3"

# Used by ash-bootstrap for surface creation
raw-window-handle = "0.6"

# --- Winit replaces GLFW ---
winit = "0.29"

bitflags = "2.5"

# Now uses the "ash" feature
vk-mem = "0.5.0"


flecs_ecs = { git = "https://github.com/Indra-db/Flecs-Rust.git" }


# Utilities
log = "0.4"
env_logger = "0.11"
thiserror = "1.0" # For error handling
bitvec = "1.0"
anyhow = "1.0" # For error handling, as used in the example
shader-slang = "0.1.0"
glam = "0.30.9"
dot_vox = "5.1.1"


[build-dependencies]
tree-sitter-c = "0.24.1"
tree-sitter = "0.25.10"
bindgen = "0.72.1"
cmake = "0.1.54"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8" # The TOML parser
